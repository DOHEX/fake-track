[project]
name = "fake-track"
version = "1.4.0"
description = "校园跑接口调试工具"
readme = "README.md"
authors = [
    { name = "DOHEX", email = "dohex@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=48.0.0",
    "osmnx>=2.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "rich>=15.0.0",
    "requests>=2.34.0",
    "typer>=0.25.1",
    "matplotlib>=3.10.9",
    "nicegui>=3.12.0",
    "apscheduler>=4.0.0a6",
    "tomlkit>=0.15.0",
]

[project.scripts]
fake-track = "fake_track.cli:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["I", "E", "W", "F", "B", "UP", "SIM", "RUF", "C4", "PIE"]
ignore = ["E501", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"src/fake_track/web/*" = ["B008", "SIM117"]
"src/fake_track/cli/*" = ["B008"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "prek>=0.3.13",
    "ruff>=0.15.13",
    "pyright>=1.1.400",
]
